# docker compose up --build, then open http://localhost:8000
# Put LLM_API_KEY (and optionally LLM_BASE_URL / LLM_MODEL) in a .env file next to this one
# to get written answers; without them DocMind runs in quote mode.
services:
  docmind:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
    volumes:
      - docmind-data:/data # uploads, the SQLite index and the embedding model cache

volumes:
  docmind-data:
